# Maintainer's Copilot — Streamlit admin console theme.
# Dark "OLED slate + green" identity, shared with the embeddable widget and
# the demo host page. The Inter webfont + CSS polish are layered on per-page
# by streamlit_app/_theme.py (config.toml can't load webfonts on its own).
[theme]
base = "dark"
primaryColor = "#22c55e"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#f8fafc"
font = "sans serif"
