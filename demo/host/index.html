<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Maintainer's Copilot — Allowed host demo</title>
    <style>
      body { font-family: system-ui,-apple-system,sans-serif; margin: 40px auto; max-width: 720px; padding: 0 16px; color: #0f172a; }
      h1 { margin-top: 0; }
      .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #dcfce7; color: #166534; }
      code { background: #f1f5f9; padding: 1px 4px; border-radius: 3px; }
    </style>
  </head>
  <body>
    <h1>Maintainer's Copilot <span class="pill">allowed origin</span></h1>
    <p>This page's origin is in the widget's <code>allowed_origins</code>, so the
    chat widget loads in the bottom-right corner.</p>
    <p>See <a href="/RUNBOOK.md">RUNBOOK §Widget admin bootstrap</a> for how the
    embed snippet is generated.</p>

    <!-- Embed snippet — replace REPLACE_ME with the widget id from
         GET /api/admin/widgets/{id}/embed-snippet. -->
    <script src="http://localhost:8000/widget.js"
            data-widget-id="REPLACE_ME"
            data-api-base="http://localhost:8000"></script>
  </body>
</html>
