server {
  listen 80;
  server_name _;

  # Docker's embedded DNS — lets `api` resolve lazily so this container can
  # start before the api container exists.
  resolver 127.0.0.11 valid=10s;

  location / {
    root /usr/share/nginx/html;
    index index.html;
  }

  # Proxy sign-in / registration / identity calls to the API so the host
  # page's auth forms are same-origin. The API's per-widget CORS only covers
  # /widget/* and /api/chat; auth has no browser-facing CORS by design, so we
  # keep these requests same-origin instead of widening the allowlist.
  location /auth/ {
    set $api http://api:8000;
    proxy_pass $api$request_uri;
  }

  location = /api/me {
    set $api http://api:8000;
    proxy_pass $api$request_uri;
  }
}
