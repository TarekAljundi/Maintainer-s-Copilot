name: ci
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright app/ model_server/

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra api --extra dev
      - run: uv run pytest tests/unit -q

  redaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra api --extra dev
      - run: uv run pytest tests/unit/test_redaction.py -v

  build:
    runs-on: ubuntu-latest
    needs: [lint, unit, redaction]
    strategy:
      matrix:
        service: [api, model_server, streamlit, widget, migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build -f docker/${{ matrix.service }}.Dockerfile -t mc-${{ matrix.service }} . --load

  smoke_and_evals:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && echo "VAULT_TOKEN=ci-token" >> .env
      - run: docker compose up -d
      - run: ./scripts/wait_healthy.sh
      - run: curl -fsS http://localhost:8000/health
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra api --extra evals --extra dev
      - run: uv run pytest tests/smoke -q
      - run: uv run python -m evals.classification.run --out reports/classification.json
      - run: uv run python -m evals.rag.run --out reports/rag.json
      - run: uv run python -m evals.compare --current reports/ --thresholds eval_thresholds.yaml --out reports/eval_report.json
      - run: uv run python -m evals.upload --file reports/eval_report.json --sha ${{ github.sha }}
      - run: uv run python -m evals.gate reports/eval_report.json
      - uses: actions/upload-artifact@v4
        with: { name: eval_report, path: reports/ }

  promote_baseline:
    needs: smoke_and_evals
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv run python -m evals.promote --sha ${{ github.sha }}
