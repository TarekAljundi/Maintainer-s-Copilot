name: ci
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright app/ model_server/

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra api --extra dev
      - run: uv run pytest tests/unit -q

  # TODO slice 08: wire tests/unit/test_redaction.py
  # redaction:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: astral-sh/setup-uv@v3
  #     - run: uv sync --extra api --extra dev
  #     - run: uv run pytest tests/unit/test_redaction.py -v

  build:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    strategy:
      matrix:
        service: [api, model_server, streamlit, widget, migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build -f docker/${{ matrix.service }}.Dockerfile -t mc-${{ matrix.service }} . --load

