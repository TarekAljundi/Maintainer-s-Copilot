services:
  vault:
    image: hashicorp/vault:1.17
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports: ["8200:8200"]
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1"]
      interval: 5s
      retries: 10

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["${POSTGRES_PORT}:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}@db:5432/langfuse
      NEXTAUTH_SECRET: replace_in_vault
      SALT: replace_in_vault
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT}
      TELEMETRY_ENABLED: "false"
    ports: ["${LANGFUSE_PORT}:3000"]

  vault-init:
    image: hashicorp/vault:1.17
    depends_on:
      vault: { condition: service_healthy }
    environment:
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_TOKEN: ${VAULT_TOKEN}
      GROQ_API_KEY: ${GROQ_API_KEY:-placeholder}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-placeholder}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-placeholder}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-placeholder}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
    entrypoint: ["/bin/sh", "/scripts/vault_seed.sh"]
    volumes:
      - ./scripts:/scripts:ro
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    depends_on:
      db: { condition: service_healthy }
    environment:
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_TOKEN: ${VAULT_TOKEN}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: "no"

  model-server:
    build:
      context: .
      dockerfile: docker/model_server.Dockerfile
    depends_on:
      vault-init: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
    environment:
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_TOKEN: ${VAULT_TOKEN}
    volumes:
      - model-cache:/tmp/models
    ports: ["${MODEL_SERVER_PORT}:8001"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8001/health\", timeout=2).status==200 else 1)'"]
      interval: 5s
      retries: 60
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      migrate: { condition: service_completed_successfully }
      vault-init: { condition: service_completed_successfully }
      vault: { condition: service_healthy }
      model-server: { condition: service_healthy }
      langfuse: { condition: service_started }
    environment:
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_TOKEN: ${VAULT_TOKEN}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-}
    ports: ["${API_PORT}:8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8000/openapi.json\", timeout=2).status==200 else 1)'"]
      interval: 5s
      retries: 20
    restart: "no"

  chatbot:
    build:
      context: .
      dockerfile: docker/streamlit.Dockerfile
    depends_on:
      api: { condition: service_healthy }
    environment:
      API_BASE: http://api:8000
    ports: ["${STREAMLIT_PORT}:8501"]

  widget:
    build:
      context: .
      dockerfile: docker/widget.Dockerfile
    ports: ["${WIDGET_PORT}:80"]

  host:
    build:
      context: ./demo/host
    ports: ["${HOST_PORT}:80"]

  host-blocked:
    build:
      context: ./demo/host
    ports: ["${HOST_BLOCKED_PORT}:80"]

volumes:
  db-data:
  minio-data:
  model-cache:
